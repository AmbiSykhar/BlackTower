<h1 id="popup-title">Edit Character</h1>

<input type="text" class="popup-left-column" id="popup-value">
<div id="popup-stat-select" class="popup-right-column">
	<input type="radio" id="popup-hp" name="popup-value-name" value="currentHP" checked>
	<label for="popup-hp">HP</label><br>

	<input type="radio" id="popup-mp" name="popup-value-name" value="currentMP">
	<label for="popup-mp">MP</label><br>
</div>
<button id="popup-accept">Accept</button>
<button id="popup-cancel">Cancel</button>
